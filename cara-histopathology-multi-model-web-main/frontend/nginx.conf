server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
  }

  location /samples/ {
    proxy_pass http://backend:8000;
  }

  location / {
    try_files $uri /index.html;
  }
}
